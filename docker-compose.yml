name: tp11-kafka

# ---------------------------------------------------------------------------
# Kafka en modo KRaft (sin Zookeeper).
#
# Dos listeners:
#   INTERNAL  kafka:29092  -> lo usan los servicios dentro de la red de Docker
#   EXTERNAL  localhost:9092 -> lo usan las herramientas CLI y las pruebas desde Windows
#
# Un solo broker (replication factor 1) porque es una maquina de la facultad.
# En produccion serian 3 brokers con replication factor 3.
# ---------------------------------------------------------------------------
services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: tp11-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Retencion: el log guarda 7 dias de eventos. Es lo que permite el replay.
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s

  # Crea los topics con la cantidad de particiones correcta (y no por defecto).
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: tp11-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        B=kafka:29092
        echo "==> creando topics en $$B"
        kafka-topics --bootstrap-server $$B --create --if-not-exists --topic order-events \
            --partitions 3 --replication-factor 1 --config retention.ms=604800000
        kafka-topics --bootstrap-server $$B --create --if-not-exists --topic order-events-retry \
            --partitions 3 --replication-factor 1 --config retention.ms=86400000
        kafka-topics --bootstrap-server $$B --create --if-not-exists --topic order-events-dlq \
            --partitions 1 --replication-factor 1 --config retention.ms=1209600000
        echo "==> topics:"
        kafka-topics --bootstrap-server $$B --describe
        echo "==> topics listos"

  # Buzon SMTP de pruebas: captura los "correos" y los muestra en http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: tp11-kafka-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"

  # -------------------------------------------------------------------------
  # OrdersService: produce order.created / order.confirmed / order.shipped
  # -------------------------------------------------------------------------
  orders:
    build:
      context: .
      dockerfile: OrdersService/Dockerfile
    image: tp11-kafka-orders:latest
    container_name: tp11-kafka-orders
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topic: ${KAFKA_TOPIC:-order-events}
      Kafka__ClientId: orders-service
    ports:
      - "${ORDERS_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "dotnet", "--info"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # -------------------------------------------------------------------------
  # NotificationService: PRIMER consumidor (grupo notification-service)
  # -------------------------------------------------------------------------
  notification:
    build:
      context: .
      dockerfile: NotificationService/Dockerfile
    image: tp11-kafka-notification:latest
    container_name: tp11-kafka-notification
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    environment:
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topic: ${KAFKA_TOPIC:-order-events}
      Kafka__RetryTopic: ${KAFKA_RETRY_TOPIC:-order-events-retry}
      Kafka__DlqTopic: ${KAFKA_DLQ_TOPIC:-order-events-dlq}
      Kafka__GroupId: ${NOTIFICATION_GROUP:-notification-service}
      Kafka__MaxAttempts: ${MAX_ATTEMPTS:-3}
      Kafka__RetryDelayMs: ${RETRY_DELAY_MS:-2000}
      Smtp__Host: mailpit
      Smtp__Port: "1025"
      Smtp__From: notificaciones@tp11.local
      Notifications__FilePath: /app/data/notifications.jsonl
      # none | always | transient2  (ver README, seccion "Reintentos y DLQ")
      Notifications__FailMode: ${FAIL_MODE:-none}
    ports:
      - "${NOTIFICATION_PORT:-8081}:8080"
    volumes:
      - notification-data:/app/data

  # -------------------------------------------------------------------------
  # AnalyticsService: SEGUNDO consumidor, con OTRO group id.
  # Mismo topic, otro grupo => recibe el 100% de los eventos (fan-out).
  # -------------------------------------------------------------------------
  analytics:
    build:
      context: .
      dockerfile: AnalyticsService/Dockerfile
    image: tp11-kafka-analytics:latest
    # Sin container_name a proposito: asi se puede escalar el consumidor y ver como
    # las particiones se reparten entre instancias del mismo grupo:
    #   docker compose up -d --scale analytics=2
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      Kafka__BootstrapServers: kafka:29092
      Kafka__Topic: ${KAFKA_TOPIC:-order-events}
      Kafka__GroupId: ${ANALYTICS_GROUP:-analytics-service}
      Kafka__OffsetReset: ${ANALYTICS_OFFSET_RESET:-Earliest}
    ports:
      - "${ANALYTICS_PORT:-8082}:8080"

  # -------------------------------------------------------------------------
  # DemoClient: corre una vez, dispara todos los escenarios y se imprime.
  #   docker compose run --rm democlient
  # -------------------------------------------------------------------------
  democlient:
    build:
      context: .
      dockerfile: DemoClient/Dockerfile
    image: tp11-kafka-democlient:latest
    profiles: ["demo"]
    depends_on:
      - orders
      - analytics
      - notification
    command:
      - "http://orders:8080"
      - "http://analytics:8080"
      - "http://notification:8080"

volumes:
  kafka-data:
  notification-data: